name: perf-tests

on:
  workflow_dispatch:

jobs:
  k6-perf:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Empaquetar el servicio
        run: mvn -B -DskipTests clean package
        working-directory: registraduria

      - name: Levantar el servicio en segundo plano
        run: |
          nohup java -jar target/registraduria-1.0-SNAPSHOT.jar > /tmp/app.log 2>&1 &

          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "Servicio arriba"
              exit 0
            fi
            sleep 2
          done

          echo "El servicio no arrancó a tiempo"
          cat /tmp/app.log
          exit 1
        working-directory: registraduria

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: Preparar carpeta de resultados
        run: mkdir -p perf/results

      - name: Baseline de rendimiento
        run: |
          k6 run perf/scripts/register_person_k6.js \
            --env BASE_URL=http://localhost:8080 \
            --env SCENARIO=baseline \
            --duration 60s \
            --vus 20

      - name: Verificación de resultado de negocio
        run: |
          k6 run perf/scripts/register_voter_k6.js \
            --env BASE_URL=http://localhost:8080 \
            --env SCENARIO=baseline \
            --duration 60s \
            --vus 20

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: perf/results/summary-*.json
          if-no-files-found: warn